name: Architecture decision (ADR)
description: Propose a decision to record in docs/adr/ (MADR format)
title: "[ADR] "
labels: ["adr"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and problem statement
      description: What forces a decision now? Link spec sections, limits or incidents.
    validations:
      required: true
  - type: textarea
    id: drivers
    attributes:
      label: Decision drivers
      placeholder: |
        - Zero spend (NFR-01)
        - …
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Considered options
      description: At least two, with pros and cons for each.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed decision
      description: The chosen option and why.
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: Good, bad, and what must change (code, docs, runbooks).
    validations:
      required: true
