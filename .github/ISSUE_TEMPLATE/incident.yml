name: Incident
description: A failed or degraded pipeline run (usually opened automatically by daily-pipeline.yml)
title: "[Incident] <business date> <failed step>"
labels: ["incident"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Spec section 13.5.
      options:
        - Sev1 - no health update reached Salesforce
        - Sev2 - partial data or wrong scores
        - Sev3 - warning only
    validations:
      required: true
  - type: input
    id: business_date
    attributes:
      label: Business date
      placeholder: "2026-12-01"
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Failed step
      options:
        - preflight
        - generate
        - extract-load
        - transform
        - reverse-etl
        - ops
        - other
    validations:
      required: true
  - type: input
    id: run_link
    attributes:
      label: Run link
      placeholder: https://github.com/<owner>/customer-health-platform/actions/runs/<id>
    validations:
      required: false
  - type: textarea
    id: error
    attributes:
      label: Error
      description: Error message and failing check. Never paste tokens or contact details.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is stale or wrong in Salesforce or the warehouse.
    validations:
      required: true
  - type: checkboxes
    id: followup
    attributes:
      label: Resolution
      options:
        - label: Fixed through a PR or hotfix tag
        - label: Date re-run with workflow_dispatch and verified
        - label: Postmortem written in docs/incidents/INC-YYYYMMDD-n.md (Sev1 and Sev2)
