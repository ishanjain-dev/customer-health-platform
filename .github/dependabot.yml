# Dependabot keeps SHA-pinned actions and npm tooling current; reviewed weekly (spec 13.7).
# Add the pipelines/ (uv) ecosystem when the chp package lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["tech-debt"]
    commit-message:
      prefix: chore(ci)
  - package-ecosystem: npm
    directory: /salesforce
    schedule:
      interval: weekly
      day: monday
    labels: ["tech-debt"]
    commit-message:
      prefix: chore(sf)
